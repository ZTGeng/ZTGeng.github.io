<!DOCTYPE HTML>
<html lang="en" data-bilingual="true">

<head>
    <meta charset="utf-8">
    <script src="/shared/site-ui.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Chinese Chess</title>
    <meta name="description" content="gomoku">
    <meta name="author" content="Geng">

    <link rel="stylesheet" type="text/css" href="/shared/bootstrap-5.3.2.min.css">
    <link rel="stylesheet" type="text/css" href="css/cchess.css">
    <script type="text/javascript" src="/shared/jquery.min.js"></script>
    <script type="text/javascript" src="/shared/bootstrap-5.3.2.bundle.min.js"></script>
    <script type="text/javascript" src="js/cchess.js"></script>
</head>

<body>
    <div class="container">
        {% include header.html active-tab='games' breadcrumb-page='Chinese Chess' breadcrumb-page-zh='中国象棋' %}

        <h1 id="gameName">Chinese Chess</h1>
        <div class="text-center">
            <div id="field">

            </div>
            <div class="d-flex justify-content-center">
                <img src="images/cchess/red.jpg" class="me-2">
                <div class="me-4">
                    <h3 id="rlabel" class="strong"> RED </h3>
                    <h1><span id="rwin" class="strong text-danger">WIN</span></h1>
                    <h4><span id="rcheck" class="strong text-danger">Check</span></h4>
                </div>
                <div>
                    <h3 id="blabel" class="media-heading">BLACK</h3>
                    <h1><span id="bwin" class="label label-danger">WIN</span></h1>
                    <h4><span id="bcheck" class="label label-danger">Check</span></h4>
                </div>
                <img src="images/cchess/black.jpg" class="ms-2">
            </div>
            <br>
            <div class="panel penal-default">
                <button id="reset" class="btn btn-secondary">RESET</button>
                <button id="resign" class="btn btn-secondary">RESIGN</button>
            </div>
        </div>

        {% include comments.html id='page:/games/cchess.html' %}
        {% include footer.html %}
    </div>

    <script>
        SiteUI.onLanguageChange(language => {
            SiteUI.translate([
                {"selector": "title", "en": "Chinese Chess", "zh": "中国象棋"},
                {"selector": "#gameName", "en": "Chinese Chess", "zh": "中国象棋"},
                {"selector": "#blabel", "en": "BLACK", "zh": "黑方"},
                {"selector": "#rlabel", "en": " RED ", "zh": "红方"},
                {"selector": "#rwin", "en": "WIN", "zh": "胜"},
                {"selector": "#bwin", "en": "WIN", "zh": "胜"},
                {"selector": "#rcheck", "en": "Check", "zh": "将军"},
                {"selector": "#bcheck", "en": "Check", "zh": "将军"},
                {"selector": "#reset", "en": "RESET", "zh": "重新开始"},
                {"selector": "#resign", "en": "RESIGN", "zh": "认输"}
            ], language);
        });
    </script>

</body>

</html>
