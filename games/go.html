<!DOCTYPE HTML>
<html lang="en" data-bilingual="true">

<head>
    <meta charset="utf-8">
    <script src="/shared/site-ui.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Go</title>
    <meta name="description" content="gomoku">
    <meta name="author" content="Geng">

    <link rel="stylesheet" type="text/css" href="/shared/bootstrap-5.3.2.min.css">
    <link rel="stylesheet" type="text/css" href="css/go.css">
    <script type="text/javascript" src="/shared/jquery.min.js"></script>
    <script type="text/javascript" src="/shared/bootstrap-5.3.2.bundle.min.js"></script>
    <script type="text/javascript" src="js/go.js"></script>
</head>

<body>
    <div class="container">
        {% include header.html active-tab='games' breadcrumb-page='Go' breadcrumb-page-zh='围棋' %}

        <h1 id="gameName">Go</h1>
        <div>
            <div class="text-center" id="field"></div>
            <div class="row-fluid">
                <div id="taken" class="d-flex text-center"></div>
            </div>
            <div class="d-flex justify-content-center">
                <img src="images/blackpiece.jpg" class="me-2">
                <div id="bbox" class="me-4">
                    <h3 id="blabel" class="media-heading">BLACK</h3>
                    <h1><span id="bnum" class="label label-primary"></span></h1>
                </div>
                <div id="wbox">
                    <h3 id="wlabel" class="media-heading">WHITE</h3>
                    <h1><span id="wnum" class="label label-primary"></span></h1>
                </div>
                <img src="images/whitepiece.jpg" class="ms-2">
            </div>
            <br>
            <div class="btn-toolbar justify-content-center" role="toolbar">
                <div class="btn-group ms-2" role="group">
                    <button id="reset" class="btn btn-primary">RESET</button>
                </div>
                <div class="btn-group ms-2" role="group">
                    <input type="radio" class="btn-check" name="options" id="alternately" autocomplete="off" checked>
                    <label id="alter-span" class="btn btn-outline-primary" for="alternately">Alternately</label>

                    <input type="radio" class="btn-check" name="options" id="black-only" autocomplete="off">
                    <label id="black-span" class="btn btn-outline-primary" for="black-only">Black Only</label>

                    <input type="radio" class="btn-check" name="options" id="white-only" autocomplete="off">
                    <label id="white-span" class="btn btn-outline-primary" for="white-only">White Only</label>
                </div>
                <div class="btn-group ms-2" role="group">
                    <button id="show-number" type="button" class="btn btn-primary" data-toggle="button" aria-pressed="false" autocomplete="off"
                        data-on-text="Hide Number" data-off-text="Show Number">
                        Show Number
                    </button>
                </div>
            </div>
        </div>

        {% include comments.html id='page:/games/go.html' %}
        {% include footer.html %}
    </div>

    <script>
        SiteUI.onLanguageChange(language => {
            SiteUI.translate([
                {"selector": "title", "en": "Go", "zh": "围棋"},
                {"selector": "#gameName", "en": "Go", "zh": "围棋"},
                {"selector": "#blabel", "en": "BLACK", "zh": "黑方"},
                {"selector": "#wlabel", "en": "WHITE", "zh": "白方"},
                {"selector": "#alter-span", "en": "Alternately", "zh": "交替落子"},
                {"selector": "#black-span", "en": "Black Only", "zh": "黑方布子"},
                {"selector": "#white-span", "en": "White Only", "zh": "白方布子"},
                {"selector": "#reset", "en": "RESET", "zh": "重新开始"},
                {"selector": "#show-number", "en": "\n                        Show Number\n                    ", "zh": "显示顺序"}
            ], language);
        });
    </script>

</body>

</html>
